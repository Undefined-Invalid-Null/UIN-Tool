plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    // Compose 编译器插件版本必须与 Kotlin 完全一致（见根 build.gradle 的升级说明）
    id "org.jetbrains.kotlin.plugin.compose" version "2.3.10"
}

// ===== A-04：签名口令不再以明文写在 build.gradle 里 =====
// 优先级：环境变量 UIN_STORE_PASSWORD / UIN_KEY_PASSWORD
//        > 项目根 keystore.properties（已加入 .gitignore）
//        > ~/.gradle/gradle.properties 中的 uin.storePassword / uin.keyPassword
// 三处都取不到就直接报错并给出创建指引，而不是把明文退回源码。
def loadSigningSecret = { String envName, String propName ->
    def v = System.getenv(envName)
    if (v) return v
    def f = rootProject.file("keystore.properties")
    if (f.exists()) {
        def props = new Properties()
        f.withInputStream { props.load(it) }
        v = props.getProperty(propName)
        if (v) return v
    }
    def userProps = new File(System.getProperty("user.home"), ".gradle/gradle.properties")
    if (userProps.exists()) {
        def props = new Properties()
        userProps.withInputStream { props.load(it) }
        v = props.getProperty("uin." + propName)
        if (v) return v
    }
    throw new GradleException(
        "缺少签名口令 ${propName}：请在项目根目录创建 keystore.properties，\n" +
        "  内容示例：\n    storePassword=...\n    keyPassword=...\n" +
        "  或设置环境变量 ${envName}，或在 ~/.gradle/gradle.properties 中写 uin.${propName}=...")
}
def signingStorePassword = loadSigningSecret("UIN_STORE_PASSWORD", "storePassword")
def signingKeyPassword = loadSigningSecret("UIN_KEY_PASSWORD", "keyPassword")

android {
    namespace "com.UIN.Tool"
    compileSdk 36

    ndkVersion = "29.0.14033849"

    defaultConfig {
        applicationId "com.UIN.Tool"
        minSdk 23
        targetSdk 28
        versionCode 26
        versionName "6.2.0"

        manifestPlaceholders.UIN_PACKAGE_NAME = "com.UIN.Tool"
        manifestPlaceholders.UIN_APP_NAME = "UIN Tool"

        resourceConfigurations += ["en", "zh-rCN"]

        ndk {
            abiFilters += ["arm64-v8a"]
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            // A-04：口令从 keystore.properties / 环境变量读取，不再硬编码
            storePassword signingStorePassword
            keyPassword signingKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro', 'app-keep.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'app-keep.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
            // 接口默认方法编译为真正的 JVM default 方法（而非 abstract + DefaultImpls），
            // 使旧版编译的插件 dex 即便不重写 onHostEvent 等方法也不会抛 AbstractMethodError。
            freeCompilerArgs.add("-Xjvm-default=all")
        }
    }

    buildFeatures {
        compose = true
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    // A-11：app 模块的 externalNativeBuild 已整体移除——原 path 指向的
    // src/main/cpp/Android.mk 只有一行 LOCAL_PATH、不定义任何 module，真正的
    // jni/Android.mk(pty) 又被下面的 jni.srcDirs 覆盖，且全仓无人
    // System.loadLibrary("pty")；真正的原生库由 terminal-emulator(libtermux)
    // 与 termux-shared 自行构建。jni.srcDirs 保留覆盖，避免误编 src/main/jni。
    sourceSets {
        main {
            jni.srcDirs("src/main/cpp")
            jniLibs.srcDirs("src/main/jniLibs")
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/INDEX.LIST"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += "/META-INF/*.kotlin_module"
            excludes += "**/*.proto"
            excludes += "**/*.kotlin_builtins"
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        checkReleaseBuilds = false
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("uin-tool_" + (abi ? abi : "universal") + "_debug.apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("uin-tool_" + (abi ? abi : "universal") + "_release.apk")
            }
        }
    }
}

// ============================================================
// 修复依赖冲突 - 强制使用最新版本
// ============================================================
configurations.all {
    // 排除 Atlassian 的旧版 commonmark
    exclude group: 'com.atlassian.commonmark', module: 'commonmark'
    
    resolutionStrategy {
        force "org.commonmark:commonmark:0.22.0"
        // 随 Kotlin 升级同步上调，避免 stdlib 版本被钉在旧版导致
        // 「编译器 2.3.10 + stdlib 2.1.0」这种混搭。
        force "org.jetbrains.kotlin:kotlin-stdlib:2.3.10"
        force "com.squareup.okhttp3:okhttp:4.12.0"
    }
}

dependencies {
    // ==================== 基础依赖 ====================
    implementation "androidx.annotation:annotation:1.9.0"
    // E-09（方案B）：显式声明 —— 全量 Activity 迁 AppCompatActivity 走 AppCompatDelegate 夜间模式
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.preference:preference:1.2.1"
    // G-28：小部件后台周期刷新（WorkManager ≥15min 周期任务）
    implementation "androidx.work:work-runtime-ktx:2.9.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    
    // A-06：minSdk 23 ≥ 21 走系统原生 multidex，已删除 multiDexEnabled/
    // multiDexKeepProguard 与 MultiDex.install()；原 multidex-config.pro 更名
    // 为 app-keep.pro 继续作为 proguard 规则文件（其全局 keep 是否收紧见 A-05 决策）

    implementation project(":terminal-view")
    implementation project(":termux-shared")

    // ==================== UIN Tool 依赖 ====================
    // Compose
    implementation platform("androidx.compose:compose-bom:2025.08.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation 'io.github.sridhar-sp:neumorphic:0.0.6'
    

    // Kotlin
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"

    // 协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // ==================== Shizuku / Dhizuku ====================
    // 注意：版本受限——Shizuku api 13.x 需 minSdk 24（项目为 23），故用 12.2.0（minSdk 23）；
    // Dhizuku-API 2.6.0 需 compileSdk 37（项目 compileSdk 36 / AGP 8.9.1），故用 2.5.3（compileSdk 无限制）
    implementation "dev.rikka.shizuku:api:12.2.0"
    implementation "dev.rikka.shizuku:provider:12.2.0"
    implementation("io.github.iamr0s:Dhizuku-API:2.5.3") {
        exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib'
    }

    // 网络
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    // Markdown
    implementation "org.commonmark:commonmark:0.22.0"

    // 其他
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"

    // ==================== Sora Editor (使用 BOM) ====================
    // ✅ BOM 统一管理版本
    // 6.2.0 批次40：0.24.4 → 0.24.6。
    // 修的是上游 bug（b39ad1bc）：TextMateAnalyzer 对**带下划线**的 token 总是取
    // NoExtSpanImpl，随后又调 setUnderlineColor —— 而 NoExtSpanImpl 该方法直接 throw
    // UnsupportedOperationException，整条 AsyncAnalyzer 线程当场死掉，表现就是
    // 「打开某些 html 文件后语法高亮全没了」（logcat 里 AsyncAnalysis: Thread failed）。
    // 0.24.5 起改为「需要下划线才取扩展 span」。
    // 升级前逐个比对过 0.24.4→0.24.6 的 public API：仅删了 EditorSearcher.replaceThis
    // 与 DirectAccessProps.stickyScrollIterationLimit，本工程均零引用。
    implementation platform("io.github.rosemoe:editor-bom:0.24.6")
    // A-09：brotli 全仓零引用已删；asm 系列全仓也零引用，但 libs/host-sdk.jar
    // （compileOnly，编译器走反射加载）可能在运行期用到字节码 API，故暂留
    implementation 'org.ow2.asm:asm:9.6'
    implementation 'org.ow2.asm:asm-commons:9.6'
    implementation 'org.ow2.asm:asm-tree:9.6'
    
    
    // 核心编辑器
    implementation "io.github.rosemoe:editor"
    
    // TextMate 语言支持（语法高亮）
    implementation "io.github.rosemoe:language-textmate"
    
    // 编译器
    compileOnly files("libs/host-sdk.jar")

    // 压缩
    implementation "org.apache.commons:commons-compress:1.26.2"
    implementation "org.tukaani:xz:1.9"
    implementation("com.github.luben:zstd-jni:1.5.6-9@aar")

    // 测试
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2025.08.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}