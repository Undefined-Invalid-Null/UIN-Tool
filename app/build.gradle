plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.0"
}

ext {
    packageVariant = System.getenv("TERMUX_PACKAGE_VARIANT") ?: "apt-android-7"
}

android {
    namespace "com.UIN.Tool"
    compileSdk 35

    ndkVersion = "29.0.14033849"

    defaultConfig {
        applicationId "com.UIN.Tool"
        minSdk 23
        targetSdk 28
        versionCode 12
        versionName "4.2.0"

        multiDexEnabled true
        multiDexKeepProguard file('multidex-config.pro')

        buildConfigField "String", "TERMUX_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\""

        manifestPlaceholders.TERMUX_PACKAGE_NAME = "com.UIN.Tool"
        manifestPlaceholders.TERMUX_APP_NAME = "UIN Tool"

        resourceConfigurations += ["en", "zh-rCN", "ja"]

        ndk {
            abiFilters += ["arm64-v8a"]
        }

        externalNativeBuild {
            ndkBuild {
                cFlags += "-std=c17"
                cFlags += "-Wall"
                cFlags += "-Wextra"
                cFlags += "-Os"
                cFlags += "-fno-stack-protector"
                cFlags += "-Wl,--gc-sections"
                abiFilters += ["arm64-v8a"]
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro', 'multidex-config.pro'
        }
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'multidex-config.pro'
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
        }
    }

    buildFeatures {
        compose = true
        viewBinding = true
        dataBinding = true
        buildConfig = true
    }

    externalNativeBuild {
        ndkBuild {
            path = file("src/main/cpp/Android.mk")
        }
    }

    sourceSets {
        main {
            jni.srcDirs("src/main/cpp")
            jniLibs.srcDirs("src/main/jniLibs")
        }
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/INDEX.LIST"
            excludes += "/META-INF/DEPENDENCIES"
            excludes += "/META-INF/*.kotlin_module"
            excludes += "**/*.proto"
            excludes += "**/*.kotlin_builtins"
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }

    lint {
        disable 'ProtectedPermissions'
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("uin-tool_" + (abi ? abi : "universal") + "_debug.apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("uin-tool_" + (abi ? abi : "universal") + "_release.apk")
            }
        }
    }
}

// ============================================================
// 修复依赖冲突 - 强制使用最新版本
// ============================================================
configurations.all {
    // 排除 Atlassian 的旧版 commonmark
    exclude group: 'com.atlassian.commonmark', module: 'commonmark'
    
    resolutionStrategy {
        force "org.commonmark:commonmark:0.22.0"
        force "org.jetbrains.kotlin:kotlin-stdlib:2.1.0"
        force "androidx.core:core-ktx:1.13.1"
        force "com.squareup.okhttp3:okhttp:4.12.0"
    }
}

dependencies {
    // ==================== Termux 原有依赖 ====================
    implementation "androidx.annotation:annotation:1.9.0"
    implementation "androidx.core:core:1.13.1"
    implementation "androidx.drawerlayout:drawerlayout:1.2.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.viewpager:viewpager:1.0.0"
    implementation "com.google.android.material:material:1.12.0"
    
    // MultiDex
    implementation 'androidx.multidex:multidex:2.0.1'
    
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"
    implementation "io.noties.markwon:recycler:4.6.2"

    implementation project(":terminal-view")
    implementation project(":termux-shared")

    // ==================== UIN Tool 依赖 ====================
    // Compose
    implementation platform("androidx.compose:compose-bom:2024.09.00")
    implementation "androidx.compose.ui:ui"
    implementation "androidx.compose.ui:ui-graphics"
    implementation "androidx.compose.ui:ui-tooling-preview"
    implementation "androidx.compose.material3:material3"
    implementation "androidx.compose.material3:material3-window-size-class"
    implementation "androidx.compose.runtime:runtime-livedata"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.navigation:navigation-compose:2.7.7"

    // Kotlin
    implementation "androidx.core:core-ktx:1.12.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:2.7.0"
    implementation "androidx.activity:activity-compose:1.8.2"

    // 协程
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"

    // 网络
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
    implementation "com.squareup.okhttp3:logging-interceptor:4.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"

    // Markdown
    implementation "org.commonmark:commonmark:0.22.0"

    // 其他
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:1.2.0"
    implementation "androidx.core:core-splashscreen:1.0.1"

    // ==================== Sora Editor (使用 BOM) ====================
    // ✅ BOM 统一管理版本
    implementation platform("io.github.rosemoe:editor-bom:0.24.4")
    
    // 核心编辑器
    implementation "io.github.rosemoe:editor"
    
    // TextMate 语言支持（语法高亮）
    implementation "io.github.rosemoe:language-textmate"
    
    // Java 语言支持（可选，如果不需要可以移除）
    implementation "io.github.rosemoe:language-java"

    // 编译器
    compileOnly files("libs/host-sdk.jar")

    // 压缩
    implementation "org.apache.commons:commons-compress:1.26.2"
    implementation "org.tukaani:xz:1.9"

    // 测试
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.10"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation platform("androidx.compose:compose-bom:2024.09.00")
    androidTestImplementation "androidx.compose.ui:ui-test-junit4"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}