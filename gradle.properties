#AndroidCS: enforce UTF-8 & locale for Gradle daemon
#Sat Sep 26 15:19:47 GMT 2026
android.disableAutomaticLintVital=true
android.enablePublishCheck=false
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.lint.checkReleaseBuilds=false
android.lint.enableVital=false
android.lint.enabled=false
android.suppressUnsupportedCompileSdk=37
android.useAndroidX=true
# ── 2026-10-31（N15）：AGP 9 的两个 escape hatch，**都必须关** ────────────────
# 升到 AGP 9.1.1 后，第 3 行的 kotlin-android 连着撞了两面墙（构建日志原文）：
#   ① Failed to apply plugin 'org.jetbrains.kotlin.android'
#      The 'org.jetbrains.kotlin.android' plugin is no longer required ... since AGP 9.0
#   ② Failed to apply plugin 'org.jetbrains.kotlin.android'
#      The 'org.jetbrains.kotlin.android' plugin is not compatible with AGP's 9.0 new DSL
#      (`android.newDsl=true` is enabled by default).
#      Solution: Set `android.builtInKotlin=true` ... or set `android.newDsl=false` ...
#      > ClassCastException: ApplicationExtensionImpl$AgpDecorated_Decorated
#        cannot be cast to com.android.build.gradle.BaseExtension
#
# 两处官方给的都是二选一：「要么改用 AGP 自带的，要么关掉新特性」。
# **本项目两处都选「关掉新特性」，理由是同一个：AGP 自带的 Kotlin 更旧。**
#
# AGP 自带 Kotlin **2.2.10**（逐行拉 dl.google.com 的 gradle-9.1.1.pom 核实：
# org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10，`.module` 里是软约束 requires、
# 全文件无 strictly/rejects）；而 sora-editor 0.24.5/0.24.6 的 AAR 是 Kotlin 2.3.10 编的
# （metadata 2.3.0），0.24.7 是 Kotlin 2.4.10（metadata 2.4.x）—— 2.2.10 都读不到，那正是
# 6.2.0 批次40 治好的 35 条 e:「incompatible version of Kotlin」。照官方建议走
# builtInKotlin=true，等于把编译器从我们自己的 2.4.21 **降回 2.2.10 并让那 35 条原样复发**，
# 是降级不是升级。
#
android.builtInKotlin=false
# 第 ② 条：android{} 在 AGP 9 只实现新公共接口、不再继承 BaseExtension，而 KGP 的
# kotlin-android 要把 android{} 强转成 BaseExtension（栈：AgpWithBuiltInKotlinAppliedCheck
# .checkIfNewDslIsUsed）。关掉新 DSL 类型即恢复 BaseExtension 体系 —— 顺带让
# app/build.gradle 里 AGP 8 时代的 android{...} 写法原样可用。
# 注意它**只**管 android{} 的类型：applicationVariants 是另一个开关
# （android.enableLegacyVariantApi=true），本项目**不需要** —— 已迁到 androidComponents。
android.newDsl=false
# ⚠ 两个开关官方都标了「temporarily / escape hatch」，**AGP 10.0 会一并移除**。
# 届时只有两条出路（MT.md §6.0 已记，现在只记不动）：
#   ① sora-editor 换成用 Kotlin ≥ 2.2.10 编的版本后改回内建 Kotlin；
#   ② 升到内建 Kotlin ≥ 2.4.x 的 AGP 版本。
compileSdkVersion=37
markwonVersion=4.6.2
minSdkVersion=23
ndkVersion=29.0.14033849
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx8192M -Dfile.encoding\=UTF-8 -Dsun.jnu.encoding\=UTF-8 -Duser.language\=en -Duser.country\=US
org.gradle.parallel=true
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
targetSdkVersion=28
