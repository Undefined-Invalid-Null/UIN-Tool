# UIN Tool — Android Build & CI Workflow
#
# 触发条件:
#   - push / pull-request 到 main / master 分支
#
# 环境:
#   - Ubuntu Latest
#   - Java 17 (AGP 8.9.1 要求 JDK 17+；与根 build.gradle 版本口径保持一致)
#   - Gradle 缓存加速

name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# A-54：默认令牌只给读权限（本流水线只需 checkout，不需要写 contents/packages）
permissions:
  contents: read

jobs:
  ###############################################################
  # 1. 质量检查 — lint + 单元测试
  ###############################################################
  lint-and-test:
    name: Lint & Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A-22：.gitattributes 声明 *.tar.xz 走 LFS，不加 lfs:true 只会拿到指针文件，
          # 打出来的 APK 内 rootfs 是坏的且不报错
          lfs: true

      # CI 没有本地那份 keystore.properties（被 .gitignore 忽略、也没配 secrets），
      # 而 app/build.gradle 在配置期就取签名口令，取不到会直接抛 GradleException，
      # 导致 lint / test 一秒都跑不到执行阶段（2026-10-08 起连红的根因）。
      # 这里装的是随仓库提交的 debug 测试钥匙口令，仅供构建使用。
      - name: Prepare signing properties (debug test key)
        run: cp ci-signing.properties keystore.properties

      # A-31：zh-rCN 与 default 字符串键/占位符必须对齐（6.1.0 质量基线），失败即止
      - name: Check strings.xml parity
        run: python3 scripts/check_strings_parity.py

      # A-54：gradlew/wrapper jar 被篡改是最常见的 CI 供应链攻击面，先校验再执行
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # terminal-emulator 走 ndkBuild，ndkVersion 被 gradle.properties 钉死；
      # runner 自带的 NDK 版本未必对得上，先尽力装好对应版本（装不上只告警不失败，
      # 真正需要 NDK 的 assembleDebug 会自己报错，用不到 NDK 的步骤不受影响）
      - name: Install pinned NDK (best effort)
        run: |
          ndkver=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          echo "pinned ndkVersion=$ndkver"
          if [ -z "$ndkver" ] || [ -d "$ANDROID_HOME/ndk/$ndkver" ]; then
            echo "already satisfied"
          else
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$ndkver" \
              || echo "::warning::NDK $ndkver install failed (terminal-emulator 的 ndkBuild 需要它)"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run lint
        run: ./gradlew lint
        continue-on-error: true

      - name: Run unit tests
        run: ./gradlew test

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # lint 任务可能在任一模块执行，放开到全仓（原来只盯 app/ 会漏报告）
          name: lint-reports
          path: '**/build/reports/lint-results*.html'
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # 单测在 terminal-emulator 等模块跑，报告不在 app/ 下，原来那个路径永远匹配不到
          name: test-reports
          path: '**/build/reports/tests/**'
          retention-days: 14

  ###############################################################
  # 2. Debug 构建 — 每次 push / PR 都会执行
  ###############################################################
  build-debug:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: lint-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # A-22：.gitattributes 声明 *.tar.xz 走 LFS，不加 lfs:true 只会拿到指针文件，
          # 打出来的 APK 内 rootfs 是坏的且不报错
          lfs: true

      # 同 job1：CI 上没有 keystore.properties，缺了它 app/build.gradle 配置期就抛异常
      - name: Prepare signing properties (debug test key)
        run: cp ci-signing.properties keystore.properties

      # A-54：gradlew/wrapper jar 被篡改是最常见的 CI 供应链攻击面，先校验再执行
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: 'temurin'

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses

      # terminal-emulator 走 ndkBuild，ndkVersion 被 gradle.properties 钉死；
      # runner 自带的 NDK 版本未必对得上，先尽力装好对应版本（装不上只告警不失败，
      # 真正需要 NDK 的 assembleDebug 会自己报错，用不到 NDK 的步骤不受影响）
      - name: Install pinned NDK (best effort)
        run: |
          ndkver=$(sed -n 's/^ndkVersion=//p' gradle.properties)
          echo "pinned ndkVersion=$ndkver"
          if [ -z "$ndkver" ] || [ -d "$ANDROID_HOME/ndk/$ndkver" ]; then
            echo "already satisfied"
          else
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;$ndkver" \
              || echo "::warning::NDK $ndkver install failed (terminal-emulator 的 ndkBuild 需要它)"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Verify LFS assets are real files (not pointers)
        run: |
          f=app/src/main/assets/debian-rootfs.tar.xz
          size=$(stat -c %s "$f")
          echo "debian-rootfs.tar.xz = $size bytes"
          # 指针文件只有 ~130 字节；真实资产 44MB，阈值取 10MB（曾误写成 100MB，
          # 真文件 44179912 < 100000000 会被误判成指针而 exit 1）
          if [ "$size" -lt 10000000 ]; then
            echo "::error::$f is $size bytes - looks like an LFS pointer, check lfs:true"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug

      # A-54：产物哈希随包发布，下载方可以校验 artifact 未被替换
      - name: Generate APK checksum
        run: |
          cd app/build/outputs/apk/debug
          sha256sum *.apk | tee sha256sum.txt

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: uin-tool-debug
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/debug/sha256sum.txt
          retention-days: 30